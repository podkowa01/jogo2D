<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Battle 2D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>⚡ NEON BATTLE ⚡</h1>
        <p>Derrote seu adversário e domine a arena!</p>
    </header>

    <div class="hud">

        <div class="player-info blue-info">
            <span>🔵 JOGADOR 1</span>
            <div class="health-bar">
                <div id="vida1"></div>
            </div>
        </div>

        <div class="score">
            <span id="placar1">0</span>
            <b>VS</b>
            <span id="placar2">0</span>
        </div>

        <div class="player-info red-info">
            <span>🔴 JOGADOR 2</span>
            <div class="health-bar">
                <div id="vida2"></div>
            </div>
        </div>

    </div>

    <main id="game">

        <!-- Decoração da arena -->
        <div class="linha linha1"></div>
        <div class="linha linha2"></div>

        <!-- Obstáculos -->
        <div class="obstaculo obstaculo1"></div>
        <div class="obstaculo obstaculo2"></div>
        <div class="obstaculo obstaculo3"></div>
        <div class="obstaculo obstaculo4"></div>

        <!-- Jogadores -->
        <div id="jogador1" class="jogador azul">
            <div class="olho"></div>
        </div>

        <div id="jogador2" class="jogador vermelho">
            <div class="olho"></div>
        </div>

        <!-- Projéteis aparecem aqui -->

        <!-- Tela de vitória -->
        <div id="fim">

            <div class="trofeu">🏆</div>

            <h2 id="vencedor">
                JOGADOR 1 VENCEU!
            </h2>

            <p id="resultado"></p>

            <button onclick="reiniciar()">
                ⚔️ JOGAR NOVAMENTE
            </button>

        </div>

    </main>

    <section class="controles">

        <div class="controle azul-box">
            <h3>🔵 JOGADOR 1</h3>

            <p><b>W A S D</b> → Mover</p>
            <p><b>F</b> → Atirar</p>
            <p><b>G</b> → Dash</p>
        </div>

        <div class="controle red-box">
            <h3>🔴 JOGADOR 2</h3>

            <p><b>↑ ↓ ← →</b> → Mover</p>
            <p><b>L</b> → Atirar</p>
            <p><b>K</b> → Dash</p>
        </div>

    </section>

    <div id="mensagem">
        ⚡ LUTE!
    </div>

    <script src="script.js"></script>

</body>
</html>
