<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Batalha 2D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚔️ BATALHA 2D ⚔️</h1>

    <div class="placar">

        <div>
            <h3>🔵 Jogador 1</h3>

            <div class="barra">
                <div id="vida1"></div>
            </div>
        </div>

        <div id="pontos">
            0 × 0
        </div>

        <div>
            <h3>🔴 Jogador 2</h3>

            <div class="barra">
                <div id="vida2"></div>
            </div>
        </div>

    </div>


    <div id="arena">

        <!-- Jogador 1 -->
        <div id="jogador1" class="jogador azul"></div>

        <!-- Jogador 2 -->
        <div id="jogador2" class="jogador vermelho"></div>


        <!-- Obstáculos -->
        <div class="bloco bloco1"></div>

        <div class="bloco bloco2"></div>

        <div class="bloco bloco3"></div>


        <!-- Tela de vitória -->
        <div id="telaFinal">

            <h2 id="textoVitoria">
                JOGADOR 1 VENCEU!
            </h2>

            <button onclick="reiniciar()">
                Jogar novamente
            </button>

        </div>

    </div>


    <div class="controles">

        <div>
            <h3>🔵 Jogador 1</h3>

            <p>W A S D = mover</p>
            <p>F = atirar</p>
        </div>


        <div>
            <h3>🔴 Jogador 2</h3>

            <p>Setas = mover</p>
            <p>L = atirar</p>
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
