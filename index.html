<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Batalha 2D - 2 Jogadores</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚔️ BATALHA 2D</h1>

    <p class="info">
        Jogador 1: WASD + F |
        Jogador 2: Setas + L
    </p>

    <div id="game">

        <!-- Vida do jogador 1 -->
        <div class="vida-container vida1">
            <div id="vida1"></div>
        </div>

        <!-- Vida do jogador 2 -->
        <div class="vida-container vida2">
            <div id="vida2"></div>
        </div>

        <!-- Obstáculos -->
        <div class="obstaculo obstaculo1"></div>
        <div class="obstaculo obstaculo2"></div>
        <div class="obstaculo obstaculo3"></div>

        <!-- Jogadores -->
        <div id="jogador1" class="jogador jogador-azul">
            <div class="olho olho1"></div>
            <div class="olho olho2"></div>
        </div>

        <div id="jogador2" class="jogador jogador-vermelho">
            <div class="olho olho1"></div>
            <div class="olho olho2"></div>
        </div>

        <!-- Tela de vitória -->
        <div id="fim">
            <h2 id="vencedor"></h2>
            <button onclick="reiniciar()">Jogar novamente</button>
        </div>

    </div>

    <div class="controles">

        <div>
            <strong class="azul">🔵 Jogador 1</strong>
            <p>W A S D = Mover</p>
            <p>F = Atacar</p>
        </div>

        <div>
            <strong class="vermelho">🔴 Jogador 2</strong>
            <p>↑ ↓ ← → = Mover</p>
            <p>L = Atacar</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
